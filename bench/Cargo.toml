[package]
name = "aura-bench"
version = "0.1.0"
edition = "2024"
description = "Reproducible benchmark & durability harness for AURA-EPICS"
license = "MIT"
publish = false

[[bin]]
name = "aura-bench"
path = "src/main.rs"

[dependencies]
aura-core = { path = "../crates/aura-core" }
aura-net = { path = "../crates/aura-net" }
aura-ingest = { path = "../crates/aura-ingest" }
aura-store = { path = "../crates/aura-store" }

tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-postgres = { workspace = true }
sqlx = { workspace = true }
arc-swap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
