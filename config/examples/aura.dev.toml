# --- Real-time data transport ---
[redis]
url = "redis://127.0.0.1:6379"              # Redis server connection URL
stream = "aura:samples"                     # Stream name for PV updates
consumer_group = "aura-writers"             # Redis consumer group name
max_stream_len = 1000000                    # Keep up to ~1M samples in RAM (TRIM ~)

# --- Long-term persistence (TimescaleDB) ---
[database]
url = "postgresql://aura:aura@localhost/aura" # Database connection string
max_connections = 5                         # Max connection pool size

# --- EPICS network monitoring ---
[discover]
config_poll_interval_s = 30                 # Check for PV config changes every 30s
liveness_suspect_s = 45                     # Suspect IOC after 45s without beacon
liveness_offline_s = 150                    # Offline IOC after 150s

# --- PV Ingestion (Network Ingest) ---
[ingest]
shard_id = 0                                # Instance ID for scaling
pva_timeout_ms = 5000                       # Connection timeout for PVAccess
wal_dir = "./data/wal"                      # Local directory for Write-Ahead Logs
redis_batch_size = 256                      # Batch size before sending to Redis
redis_flush_interval_ms = 50                # Max wait time if batch is incomplete

# --- Data reduction strategy (ε-filtering) ---
[filter]
default_epsilon = 0.0                       # Deadband value (0.0 = disable)
default_heartbeat_s = 60.0                  # Heartbeat interval (seconds)
auto_calibrate = true                       # Enable auto-calculation of epsilon
calibration_window = 128                    # Samples used for noise estimation
calibration_sigma = 3.0                     # Sigma multiplier for epsilon calculation
recalibrate_interval_s = 3600               # Recalculation interval (1 hour)

# --- Database writing ---
[store]
batch_size = 250                            # Rows per batch for SQL COPY
flush_interval_ms = 500                     # Max delay before database flush

# --- Interfaces & Monitoring ---
[api]
bind = "0.0.0.0:8080"                       # API REST bind address

[metrics]
bind = "0.0.0.0:9090"                       # Metrics endpoint address

# --- Observability ---
[telemetry]
log_level = "debug"                         # Log severity level (debug, info, warn, error)
log_format = "pretty"                       # Output format (pretty for dev, json for prod)