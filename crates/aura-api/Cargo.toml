[package]
name = "aura-api"
version = "0.1.0"
edition = "2024"
description = "AURA REST API server for data retrieval and system monitoring"
license = "MIT"

[dependencies]
aura-core = { path = "../aura-core" }
aura-store = { path = "../aura-store" }

tower-http = { version = "0.7.1", features = [
    "catch-panic",
    "compression-gzip",
    "cors",
    "trace",
] }

axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }