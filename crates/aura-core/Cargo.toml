[package]
name = "aura-core"
version = "0.1.0"
edition = "2024"
description = "Shared types, configuration, and error handling for AURA-EPICS"
license = "MIT"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2+spec-1.1.0"
chrono = { version = "0.4.44", features = ["serde"] }
thiserror = "2.0.18"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
serde_json = "1.0.149"